name: Daily YouTube Automation

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 12 * * *"   # runs daily at 12:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-generativeai   # ✅ add Gemini client library

      - name: Check Gemini Key Presence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY is empty"
            exit 1
          else
            echo "✅ GEMINI_API_KEY is set"
            echo "Length: ${#GEMINI_API_KEY}"
          fi

      - name: Run automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-1.5-flash   # ✅ set to a valid model ID
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_API_KEY }}
        run: python run_automation.py
