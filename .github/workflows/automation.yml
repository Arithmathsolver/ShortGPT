- name: Run ShortGPT Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          OPENAI_MODEL: gpt-4o-mini
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "========================================================="
          echo "🛠️ FIXING ENGINE KEYWORDS AND BLOCKING ELEVENLABS RE-RUNS"
          echo "========================================================="
          
          # Force writing your exact current Python script onto the cloud server instance
          cat << 'EOF' > run_automation.py
import os
import sys
import traceback
from pathlib import Path

# Force tracking path configurations
_here = Path(__file__).parent.resolve()
if str(_here) not in sys.path:
    sys.path.insert(0, str(_here))

from shortGPT.config.api_db import ApiKeyManager
from shortGPT.engine.facts_short_engine import FactsShortEngine
from shortGPT.config.asset_db import AssetDatabase

# ✅ Swap the module initialization framework to Microsoft Edge
from shortGPT.audio.edge_voice_module import EdgeTTSVoiceModule

def get_automation_settings():
    """
    Loads automated parameters dynamically, falling back to safe structural defaults 
    if no external batch JSON/YAML is passed to the runtime environment.
    """
    return {
        "language": os.getenv("SHORTGPT_LANG", "English"),
        "voice": os.getenv("SHORTGPT_VOICE", "en-US-ChristopherNeural"), # ✅ Premium Edge Voice
        "niche_topic": os.getenv("SHORTGPT_NICHE", "Ancient History Secrets"),
        "channels_amount": int(os.getenv("SHORTGPT_BATCH_COUNT", "1")),
        "use_images": os.getenv("SHORTGPT_USE_IMAGES", "False").lower() == "true"
    }

def main():
    print("=========================================================")
    print("🚀 STARTING AUTOMATED SHORTGPT MEDIA PIPELINE GENERATION ")
    print("=========================================================")

    # Authenticate asset metadata databases
    try:
        AssetDatabase.initialize_db()
        
        # 1. Run the default synchronization check
        AssetDatabase.sync_local_assets() 
        
        print("✅ Asset Database abstraction layers initialized and synchronized successfully.")
    except Exception as db_err:
        print(f"⚠️ Database initialization notice: {db_err} (Proceeding...)")

    # Load full environment configurations
    settings = get_automation_settings()
    topic = settings["niche_topic"]
    language = settings["language"]
    voice_choice = settings["voice"]

    print(f"\n📋 Pipeline Execution Settings:")
    print(f"  • Selected Niche Category : {topic}")
    print(f"  • Target Native Language  : {language}")
    print(f"  • TTS Voice Profile Config: {voice_choice}")
    print(f"  • Batch Run Projections   : {settings['channels_amount']} video(s)\n")

    # Verify asset api credentials for critical layers (Gemini/Pexels)
    gemini_key = ApiKeyManager.get_api_key("GEMINI_API_KEY")
    if not gemini_key:
        print("❌ CRITICAL ERROR: GEMINI_API_KEY is not configured in environment or Secrets.")
        sys.exit(1)

    print("DEBUG: Instantiating high-performance EdgeTTSVoiceModule.")
    voice_module = EdgeTTSVoiceModule(voiceName=voice_choice)

    print(f"--- Starting Generation for: {topic} ---")

    try:
        # 🎬 FIXED KEYWORD ARGUMENT: voiceModule (capital M) instead of voice_module
        content_engine = FactsShortEngine(
            voiceModule=voice_module,
            facts_type=topic,
            language=language
        )

        # =====================================================================
        # ✅ THE BACKUP VOICE OVERRIDE PATCH
        # =====================================================================
        print("🛠️ Locking EdgeTTS module properties on core variables...")
        content_engine.voiceModule = voice_module
        
        content_engine._db_background_music_name = None
        content_engine._db_background_music_url = None
        
        # Overwrite the internal method on our specific running object to a harmless skip function
        def skipped_choose_background_music():
            print("⏩ Step 7 Notice: Background music skipped entirely by request.")
            content_engine._db_background_music_url = None

        content_engine._chooseBackgroundMusic = skipped_choose_background_music
        # =====================================================================

        print("🔄 Executing ShortGPT core processing engine loop blocks...")
        
        # Core pipeline engine generator loop execution tracking
        for step_num, step_logs in content_engine.makeContent():
            print(f"   [Step {step_num}/12 Progress Update]: {step_logs}")

        print("\n=========================================================")
        print("🎉 SUCCESS: Short Video Project compiled and rendered!")
        print("=========================================================")

    except Exception as engine_failure:
        print("\n❌ CRITICAL CRASH: Automation pipeline processing halted.")
        print(f"Error Details: {str(engine_failure)}")
        print("\n--- Python Traceback Log Stack ---")
        traceback.print_exc()
        print("----------------------------------")
        sys.exit(1)

if __name__ == "__main__":
    main()
EOF

          echo "✅ run_automation.py successfully forced on runner machine!"
          echo "Using GEMINI_MODEL=$GEMINI_MODEL"
          python run_automation.py
