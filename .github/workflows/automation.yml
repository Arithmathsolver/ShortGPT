# =====================================================================
# 🛡️ THE ULTIMATE LOW-LEVEL YT-DLP BOT-DETECTION BYPASS PATCH
# This intercepts yt-dlp initialization within libraries like shortGPT
# and forces it to use standard browser extraction or local cookies.txt
# =====================================================================
try:
    import yt_dlp
    original_init = yt_dlp.YoutubeDL.__init__
    
    def patched_ydl_init(self, *args, **kwargs):
        params = kwargs.get('params', {}) or args[0] if args else {}
        
        # Check if a cookies file exists locally in the workspace execution folder
        if os.path.exists("cookies.txt"):
            params['cookiefile'] = "cookies.txt"
            print("🍪 [YT-DLP PATCH]: Successfully injected local cookies.txt into scraper options.")
        else:
            # Fallback configuration options if cookies.txt is missing
            params['compatibility'] = 'no_cert_check'
            
        if args:
            args = (params,) + args[1:]
        else:
            kwargs['params'] = params
            
        original_init(self, *args, **kwargs)
        
    yt_dlp.YoutubeDL.__init__ = patched_ydl_init
    print("✅ Global Scraper Optimization: Internal yt-dlp cookie engine wrapper patched.")
except Exception as ytdlp_patch_err:
    print(f"⚠️ Internal scraper failover patch notice: {ytdlp_patch_err}")


# =====================================================================
# 🛡️ THE ULTIMATE LOW-LEVEL OPENAI CREDENTIAL DEVIATION PATCH
# This intercepts downstream calls to OpenAI() instantiation blocks.
# If shortGPT library code attempts to initialize OpenAI without valid keys,
# this directly grabs your runner environment fallback credentials.
# =====================================================================
try:
    import openai
    from openai import OpenAI as RealOpenAI

    class PatchedOpenAI(RealOpenAI):
        def __init__(self, *args, **kwargs):
            # Check if key is explicitly missing in incoming kwargs or args
            api_key = kwargs.get("api_key") or (args[0] if args else None)
            if not api_key:
                fallback_key = os.getenv("OPENAI_API_KEY") or os.getenv("GROQ_API_KEY")
                if fallback_key:
                    kwargs["api_key"] = fallback_key
            
            # Ensure the base URL routes cleanly to Groq if utilizing a Groq secret
            if kwargs.get("api_key") and "groq" in str(kwargs.get("api_key")).lower() or os.getenv("GROQ_API_KEY"):
                if not kwargs.get("base_url") or "api.openai.com" in kwargs.get("base_url"):
                    kwargs["base_url"] = os.getenv("OPENAI_API_BASE", "https://api.groq.com/openai/v1")
            
            super().__init__(*args, **kwargs)

    # Overwrite the initialization modules globally across memory spaces
    openai.OpenAI = PatchedOpenAI
    sys.modules["openai"].OpenAI = PatchedOpenAI
    print("✅ Global Class Optimization: Internal OpenAI engine wrapper patched.")
except Exception as wrapper_patch_err:
    print(f"⚠️ Internal credential failover patch notice: {wrapper_patch_err}")


# =====================================================================
# 🛡️ CORE ROUTING PATCh: INLINE LLM FAILOVER EXECUTOR
# Shared fallback function to cleanly route blocked payloads to Groq
# =====================================================================
def execute_groq_fallback(chat_prompt, system="", temp=1):
    fallback_key = os.getenv("OPENAI_API_KEY") or os.getenv("GROQ_API_KEY")
    fallback_base = os.getenv("OPENAI_API_BASE", "https://api.groq.com/openai/v1")
    fallback_model = os.getenv("OPENAI_MODEL", "llama-3.1-8b-instant")
    
    if not fallback_key:
        print("❌ FAILOVER ERROR: Neither OPENAI_API_KEY nor GROQ_API_KEY is populated!")
        return None
        
    try:
        from openai import OpenAI
        client = OpenAI(api_key=fallback_key, base_url=fallback_base)
        
        messages = []
        if system:
            messages.append({"role": "system", "content": system})
        messages.append({"role": "user", "content": chat_prompt})
        
        response = client.chat.completions.create(
            model=fallback_model,
            messages=messages,
            temperature=float(temp)
        )
        return response.choices[0].message.content
    except Exception as inline_err:
        print(f"❌ CRITICAL: Inline fallback client failed: {inline_err}")
        return None


