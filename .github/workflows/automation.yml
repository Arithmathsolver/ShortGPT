import os
import sys
import time
import traceback
from pathlib import Path

# Ensure local repository path layouts take precedence in memory
_here = Path(__file__).parent.resolve()
if str(_here) not in sys.path:
    sys.path.insert(0, str(_here))

# Force backend configuration variables to map to Groq if OpenAI-compatible wrappers are hit
if os.getenv("OPENAI_API_KEY") and not os.getenv("OPENAI_API_BASE"):
    os.environ["OPENAI_API_BASE"] = "https://api.groq.com/openai/v1"

from shortGPT.config.api_db import ApiKeyManager
from shortGPT.config.asset_db import AssetDatabase
from shortGPT.audio.edge_voice_module import EdgeTTSVoiceModule
from shortGPT.engine.facts_short_engine import FactsShortEngine

def get_automation_settings():
    return {
        "language": os.getenv("SHORTGPT_LANG", "English"),
        "voice": os.getenv("SHORTGPT_VOICE", "en-US-ChristopherNeural"), 
        "niche_topic": os.getenv("SHORTGPT_NICHE", "Deep Sea Mysteries"),
        "channels_amount": int(os.getenv("SHORTGPT_BATCH_COUNT", "1")),
        "use_images": os.getenv("SHORTGPT_USE_IMAGES", "False").lower() == "true"
    }

def main():
    print("=========================================================")
    print("🚀 STARTING AUTOMATED SHORTGPT MEDIA PIPELINE GENERATION ")
    print("=========================================================")

    try:
        AssetDatabase.initialize_db()
        AssetDatabase.sync_local_assets() 
        print("✅ Asset Database abstraction layers synchronized successfully.")
    except Exception as db_err:
        print(f"⚠️ Database initialization notice: {db_err} (Proceeding...)")

    settings = get_automation_settings()
    topic = settings["niche_topic"]
    language = settings["language"]
    voice_choice = settings["voice"]

    print(f"\n📋 Pipeline Execution Settings:")
    print(f"  • Selected Niche Category : {topic}")
    print(f"  • Target Native Language  : {language}")
    print(f"  • TTS Voice Profile Config: {voice_choice}\n")

    # Quick runtime check for the fallback key
    groq_key = os.getenv("OPENAI_API_KEY")
    if groq_key:
        print("✅ Groq Fallback Key detected in environment configuration profiles.")

    print("DEBUG: Instantiating high-performance EdgeTTSVoiceModule.")
    voice_module = EdgeTTSVoiceModule(voiceName=voice_choice)

    print(f"--- Starting Generation for: {topic} ---")

    # Flag tracking if we have tripped over into the backup pipeline yet
    using_fallback = False

    try:
        # Initialize standard Gemini configuration run
        content_engine = FactsShortEngine(
            voiceModule=voice_module,
            facts_type=topic,
            background_video_name="ocean", 
            language=language
        )

        print("🔄 Executing ShortGPT core processing engine loop blocks...")
        
        # We manually drive the steps step-by-step so we can intercept errors immediately
        step_iterator = content_engine.makeContent()
        
        while True:
            try:
                step_num, step_logs = next(step_iterator)
                print(f"   [Step {step_num}/12 Progress Update]: {step_logs}")
            except StopIteration:
                # The video generation loop successfully finished!
                break
            except Exception as loop_error:
                err_msg = str(loop_error)
                
                # Check if the error is a Gemini Quota Block
                if ("429" in err_msg or "Quota exceeded" in err_msg or "GenerateRequestsPerDay" in err_msg) and not using_fallback:
                    print("\n🚨 [SYSTEM OVERRIDE DETECTED]: Gemini Daily 20-Request Ceiling Hit.")
                    print("🔄 RE-INITIALIZING PIPELINE: Upgrading text engine blocks to use Groq API...")
                    
                    if not groq_key:
                        print("❌ FAILOVER ERROR: Cannot switch to Groq because your 'OPENAI_API_KEY' secret is missing!")
                        raise loop_error
                    
                    # Force the runtime application global flags to drop Gemini lookups entirely
                    # This tells ShortGPT to run future text steps via standard OpenAI/Groq libraries natively
                    os.environ["USE_GEMINI"] = "False"
                    if hasattr(content_engine, "use_gemini"):
                        content_engine.use_gemini = False
                        
                    using_fallback = True
                    print("✅ Framework parameters altered. Resuming pipeline compilation steps safely...\n")
                    continue
                else:
                    # If it's a completely different bug, raise it out of the wrapper
                    raise loop_error

        print("\n=========================================================")
        print("🎉 SUCCESS: Short Video Project compiled and rendered!")
        print("=========================================================")

    except Exception as engine_failure:
        print("\n❌ CRITICAL CRASH: Automation pipeline processing halted.")
        print(f"Error Details: {str(engine_failure)}")
        print("\n--- Python Traceback Log Stack ---")
        traceback.print_exc()
        print("----------------------------------")
        sys.exit(1)

if __name__ == "__main__":
    main()
