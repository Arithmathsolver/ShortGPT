name: Daily YouTube Automation

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 12 * * *"   # runs daily at 12:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Gemini Key Presence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY is empty"
            exit 1
          else
            echo "✅ GEMINI_API_KEY is set"
            echo "Length: ${#GEMINI_API_KEY}"
          fi

      - name: List Gemini Models (raw)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $GEMINI_API_KEY" \
               "https://generativelanguage.googleapis.com/v1beta/models"

      - name: Run automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_API_KEY }}   # maps your secret to the variable
        run: python run_automation.py
