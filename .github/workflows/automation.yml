        gpt_utils._patched_llm_completion = True
        
        def smart_failover_llm_completion(chat_prompt, system="", temp=1, model=None):
            try:
                # Add a brief rate-limiting buffer pause (0.5s) to mitigate Free Tier 5 RPM ceilings
                time.sleep(0.5)
                return gpt_utils._original_llm_completion(chat_prompt, system, temp, model)
            except Exception as e:
                err_msg = str(e)
                if "429" in err_msg or "Quota exceeded" in err_msg or "ResourceExhausted" in err_msg or "ceiling" in err_msg.lower():
                    print("\n🛑 [GEMINI LIMIT HIT]: Intercepted quota wall inside core gpt_utils.")
                    print("🔄 AUTOMATIC OVERRIDE: Executing inline self-contained failover via Groq API...")
                    res = execute_groq_fallback(chat_prompt, system, temp)
                    if res: return res
                raise e
                    
        gpt_utils.llm_completion = smart_failover_llm_completion
        print("✅ Global Text Optimization: Self-contained direct engine failover protection active.")
except Exception as patch_err:
    print(f"⚠️ Low-level text routing patch notice: {patch_err}")


