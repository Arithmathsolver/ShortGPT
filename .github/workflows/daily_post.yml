name: Daily YouTube Automation

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *' # runs 5 times a day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick jq curl
          
          # Complete neutralization of restrictive ImageMagick font/path security policies
          for policy in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
            if [ -f "$policy" ]; then
              echo "Applying security bypass patch to: $policy"
              sudo sed -i 's/domain="path" rights="none"/domain="path" rights="read|write"/g' "$policy" || true
              sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/g' "$policy" || true
            fi
          done

      - name: Verify FFmpeg installation
        run: |
          which ffmpeg
          ffmpeg -version

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip setuptools wheel
          
          # Install torch CPU-only first
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          
          # Pin Pillow, MoviePy
          pip install --no-cache-dir "protobuf>=3.20.1,<5.0.0dev" "Pillow<10.0.0" "moviepy<2.0.0" "openai>=1.0.0" "numpy<2.0.0"
          
          # Install core video pipeline components
          pip install --no-cache-dir yt-dlp tiktoken python-dotenv pandas tinydb tinymongo progress speechrecognition edge-tts wrapping ffmpeg-python whisper-timestamped openai-whisper
          
          # Install YouTube API dependencies
          pip install --no-cache-dir google-api-python-client google-auth-oauthlib google-auth-httplib2
          
          # Install google-generativeai
          pip install --no-cache-dir google-generativeai
          
          # Force clean install shortGPT
          pip install --no-cache-dir --no-deps --ignore-installed shortGPT

      - name: Fix Python path
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run ShortGPT Automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_BASE: "https://api.groq.com/openai/v1"
          OPENAI_MODEL: "llama-3.1-8b-instant"
          FORCE_GROQ: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IMAGEMAGICK_BINARY: "/usr/bin/convert"
          SHORTGPT_NICHE: "Deep Sea Mysteries"
          SHORTGPT_LANG: "English"
          SHORTGPT_VOICE: "en-US-ChristopherNeural"
        run: |
          echo "Using GEMINI_MODEL=$GEMINI_MODEL"
          echo "Using OPENAI_API_BASE=$OPENAI_API_BASE"
          echo "Using OPENAI_MODEL=$OPENAI_MODEL"
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "✅ Groq failover backup pipeline configured successfully."
          fi
          python run_automation.py

      - name: Upload Video to YouTube (OAuth2)
        if: success()
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TOKEN_PICKLE: ${{ secrets.TOKEN_PICKLE }}
        run: |
          # Create client_secret.json
          if [ -n "$CLIENT_SECRET" ]; then
            echo "$CLIENT_SECRET" | base64 -d > client_secret.json
            echo "✅ client_secret.json created"
          else
            echo "❌ CLIENT_SECRET secret not found"
            exit 1
          fi
          
          # Create token.pickle from secret
          if [ -n "$TOKEN_PICKLE" ]; then
            echo "$TOKEN_PICKLE" | base64 -d > token.pickle
            echo "✅ token.pickle created from secret"
          else
            echo "❌ TOKEN_PICKLE secret not found"
            exit 1
          fi
          
          # Verify files exist
          if [ ! -f "client_secret.json" ]; then
            echo "❌ client_secret.json not found"
            exit 1
          fi
          
          if [ ! -f "token.pickle" ]; then
            echo "❌ token.pickle not found"
            exit 1
          fi
          
          # Find latest video
          LATEST_VIDEO=$(ls -t videos/*.mp4 2>/dev/null | head -1)
          export LATEST_VIDEO="$LATEST_VIDEO"
          
          if [ -z "$LATEST_VIDEO" ]; then
            echo "⚠️ No video found to upload"
            exit 0
          fi
          
          echo "📤 Found video: $LATEST_VIDEO"
          echo "📊 Video size: $(du -h "$LATEST_VIDEO" | cut -f1)"
          
          python3 << 'EOF'
          import os
          import sys
          import pickle
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          
          SCOPES = ['https://www.googleapis.com/auth/youtube.upload']
          
          video_path = os.environ.get('LATEST_VIDEO')
          
          if not video_path:
              print("❌ No video path provided")
              sys.exit(1)
          
          if not os.path.exists(video_path):
              print(f"❌ Video not found: {video_path}")
              sys.exit(1)
          
          if not os.path.exists('token.pickle'):
              print("❌ token.pickle not found!")
              sys.exit(1)
          
          print(f"📤 Uploading: {video_path}")
          
          title = os.path.basename(video_path).replace('.mp4', '').split(' - ', 1)[-1]
          if not title:
              title = "ShortGPT Video"
          
          description = "Generated by ShortGPT.\n\n#shorts #facts #deepsea #ai #automation"
          keywords = ["shorts", "facts", "deepsea", "ai", "automation"]
          
          print(f"📝 Title: {title}")
          print(f"🔒 Privacy: public")
          
          # Load token.pickle
          try:
              with open('token.pickle', 'rb') as token:
                  creds = pickle.load(token)
              print("✅ Loaded token.pickle")
          except Exception as e:
              print(f"❌ Failed to load token.pickle: {e}")
              sys.exit(1)
          
          # Refresh if expired
          if creds and creds.expired and creds.refresh_token:
              try:
                  creds.refresh(Request())
                  print("✅ Token refreshed")
              except Exception as e:
                  print(f"⚠️ Token refresh failed: {e}")
          
          if not creds or not creds.valid:
              print("❌ Invalid credentials")
              sys.exit(1)
          
          try:
              youtube = build('youtube', 'v3', credentials=creds)
              print("✅ Authenticated with YouTube")
              
              body = {
                  'snippet': {
                      'title': title[:100],
                      'description': description[:5000],
                      'tags': keywords,
                      'categoryId': '22'
                  },
                  'status': {
                      'privacyStatus': 'public',
                      'selfDeclaredMadeForKids': False
                  }
              }
              
              media = MediaFileUpload(video_path, chunksize=-1, resumable=True)
              request = youtube.videos().insert(part='snippet,status', body=body, media_body=media)
              
              response = None
              last_progress = 0
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      progress = int(status.progress() * 100)
                      if progress - last_progress >= 10:
                          print(f"📊 Upload progress: {progress}%")
                          last_progress = progress
              
              print(f"✅ Upload successful: https://youtu.be/{response['id']}")
              
          except Exception as e:
              print(f"❌ Upload failed: {e}")
              sys.exit(1)
          EOF

      - name: Upload Video as Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: videos/*.mp4
          retention-days: 7

      - name: Complete
        if: always()
        run: |
          echo "========================================================="
          echo "🎉 WORKFLOW COMPLETE!"
          echo "========================================================="
          ls -la videos/ 2>/dev/null || echo "No videos found"
          echo "========================================================="
