name: Daily YouTube Automation

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *' # runs 5 times a day
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom topic (leave empty for random)'
        required: false
        default: ''
      content_type:
        description: 'Content type: random, football, trending'
        required: false
        default: 'random'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick jq curl fonts-liberation fonts-dejavu-core fonts-freefont-ttf
          
          for policy in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
            if [ -f "$policy" ]; then
              sudo sed -i 's/domain="path" rights="none"/domain="path" rights="read|write"/g' "$policy" || true
              sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/g' "$policy" || true
              sudo sed -i 's/domain="coder" rights="none" pattern="LABEL"/domain="coder" rights="read|write" pattern="LABEL"/g' "$policy" || true
              sudo sed -i 's/domain="coder" rights="none" pattern="TEXT"/domain="coder" rights="read|write" pattern="TEXT"/g' "$policy" || true
            fi
          done

      - name: Verify FFmpeg installation
        run: |
          which ffmpeg
          ffmpeg -version

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir "protobuf>=3.20.1,<5.0.0dev" "Pillow<10.0.0" "moviepy<2.0.0" "openai==0.28.0" "numpy<2.0.0"
          pip install --no-cache-dir yt-dlp tiktoken python-dotenv pandas tinydb tinymongo progress speechrecognition edge-tts wrapping ffmpeg-python whisper-timestamped openai-whisper
          pip install --no-cache-dir google-api-python-client google-auth-oauthlib google-auth-httplib2
          pip install --no-cache-dir google-generativeai
          pip install --no-cache-dir pyyaml
          pip install --no-cache-dir requests beautifulsoup4 newsapi-python
          pip install --no-cache-dir --no-deps --ignore-installed shortGPT

      - name: Fix Python path
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Create Local Background Assets
        run: |
          ffmpeg -f lavfi -i color=c=0x1a237e:s=1080x1920:d=300:r=30 \
                 -vf "drawtext=text='Amazing Facts':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=(h-text_h)/2" \
                 -an -vcodec libx264 -pix_fmt yuv420p -crf 23 -movflags +faststart test_background.mp4
          ffmpeg -f lavfi -i "sine=frequency=432:duration=300:sample_rate=44100" \
                 -af "volume=0.3" -acodec libmp3lame -b:a 128k test_audio.mp3
          echo "✅ Local assets created"

      - name: Create Fallback Images
        run: |
          for i in 1 2 3 4 5; do
            ffmpeg -f lavfi -i color=c=0x1a237e:s=1080x1920:d=1:r=1 \
                   -vf "drawtext=text='Fact $i':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=(h-text_h)/2" \
                   -frames:v 1 "fallback_image_$i.png"
          done

      - name: Run ShortGPT Automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_BASE: "https://api.groq.com/openai/v1"
          OPENAI_MODEL: "llama-3.1-8b-instant"
          FORCE_GROQ: "true"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IMAGEMAGICK_BINARY: "/usr/bin/convert"
          CUSTOM_TOPIC: ${{ github.event.inputs.topic || '' }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type || 'random' }}
        shell: python
        run: |
          import os
          import sys
          import random
          import subprocess
          import shutil
          import traceback
          from pathlib import Path

          api_key_env = os.getenv("GROQ_API_KEY") or os.getenv("OPENAI_API_KEY")
          if not api_key_env:
              print("❌ Missing GROQ_API_KEY")
              sys.exit(1)

          import openai
          openai.api_key = api_key_env
          openai.api_base = "https://api.groq.com/openai/v1"

          modern_client = None
          try:
              from openai import OpenAI as ModernOpenAI
              modern_client = ModernOpenAI(api_key=api_key_env, base_url="https://api.groq.com/openai/v1")
              print("✅ Modern OpenAI client configured")
          except:
              pass

          def get_content_type():
              content_type = os.getenv("CONTENT_TYPE", "random").lower()
              custom_topic = os.getenv("CUSTOM_TOPIC", "").strip()
              if custom_topic:
                  return custom_topic, "custom"
              if content_type in ["football", "trending"]:
                  return None, content_type
              types = ["football", "trending"]
              return None, random.choice(types)

          def get_topics(content_type, custom_topic=None):
              if custom_topic:
                  return [custom_topic]
              
              if content_type == "football":
                  topics = [
                      "2014 World Cup highlights",
                      "Vintage football legends 2014",
                      "Classic football matches 2014",
                      "Football history moments",
                      "Retro football goals 2014",
                      "2014 Brazil World Cup best moments",
                      "Football legends 2014 and before",
                      "Iconic football goals 2014",
                      "World Cup 2014 moments"
                  ]
                  return random.sample(topics, min(3, len(topics)))
              else:
                  fallback_topics = [
                      "Latest technology breakthroughs",
                      "Amazing science discoveries",
                      "Mind-blowing facts about space",
                      "Incredible animal facts",
                      "Surprising historical events",
                      "Future technology predictions",
                      "Hidden secrets of the universe"
                  ]
                  return random.sample(fallback_topics, min(3, len(fallback_topics)))

          # Patch MoviePy TextClip
          try:
              import moviepy.video.VideoClip as videoclip
              orig = videoclip.TextClip
              class Patched(orig):
                  def __init__(self, *args, **kwargs):
                      kwargs['font'] = 'Liberation-Sans-Bold'
                      try:
                          super().__init__(*args, **kwargs)
                      except:
                          kwargs['font'] = 'DejaVu-Sans-Bold'
                          try:
                              super().__init__(*args, **kwargs)
                          except:
                              kwargs['font'] = 'FreeSans'
                              super().__init__(*args, **kwargs)
              videoclip.TextClip = Patched
              print("✅ MoviePy TextClip patched")
          except:
              pass

          # Patch video extraction
          try:
              import shortGPT.editing_utils.handle_videos as hv
              def patched_extract(video_path, duration, target_duration, output_path):
                  print(f"🎬 Extracting clip from {video_path}")
                  os.makedirs(os.path.dirname(output_path), exist_ok=True)
                  cmd = [
                      'ffmpeg', '-y', '-ss', '0', '-i', video_path,
                      '-t', str(target_duration), '-an', '-vcodec', 'libx264',
                      '-crf', '23', '-pix_fmt', 'yuv420p', '-movflags', '+faststart',
                      output_path
                  ]
                  subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if os.path.exists(output_path) and os.path.getsize(output_path) > 100000:
                      return output_path
                  cmd = [
                      'ffmpeg', '-y', '-f', 'lavfi', '-i', f'color=c=0x1a237e:s=1080x1920:d={target_duration}:r=30',
                      '-an', '-vcodec', 'libx264', '-pix_fmt', 'yuv420p', '-movflags', '+faststart', output_path
                  ]
                  subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  return output_path
              hv.extract_random_clip_from_video = patched_extract
              print("✅ Video extraction patched")
          except Exception as e:
              print(f"⚠️ Video extraction patch failed: {e}")

          # Patch AssetDatabase
          try:
              from shortGPT.config import asset_db
              class PatchedDB:
                  @staticmethod
                  def get_asset_link(key):
                      key_str = str(key).lower()
                      if "subscribe" in key_str or "animation" in key_str:
                          return "test_background.mp4" if os.path.exists("test_background.mp4") else "fallback.mp4"
                      if "audio" in key_str or "music" in key_str:
                          return "test_audio.mp3" if os.path.exists("test_audio.mp3") else "test_background.mp4"
                      return "test_background.mp4" if os.path.exists("test_background.mp4") else "fallback.mp4"
                  @staticmethod
                  def get_asset_duration(key):
                      return 300.0
                  @staticmethod
                  def get_asset_name(key):
                      return str(key)
              if hasattr(asset_db, 'AssetDatabase'):
                  asset_db.AssetDatabase.get_asset_link = PatchedDB.get_asset_link
                  asset_db.AssetDatabase.get_asset_duration = PatchedDB.get_asset_duration
                  asset_db.AssetDatabase.get_asset_name = PatchedDB.get_asset_name
                  print("✅ AssetDatabase patched")
          except Exception as e:
              print(f"⚠️ AssetDatabase patch failed: {e}")

          # Patch GPT utils
          try:
              from shortGPT.gpt import gpt_utils
              def groq_completion(*args, **kwargs):
                  chat_prompt = kwargs.get('chat_prompt') or kwargs.get('prompt') or (args[0] if args else '')
                  system = kwargs.get('system', '')
                  temp = kwargs.get('temp', kwargs.get('temperature', 1.0))
                  model = kwargs.get('model', os.getenv("OPENAI_MODEL", "llama-3.1-8b-instant"))
                  messages = []
                  if system:
                      messages.append({"role": "system", "content": system})
                  messages.append({"role": "user", "content": chat_prompt})
                  if modern_client:
                      response = modern_client.chat.completions.create(
                          model=model, messages=messages, temperature=float(temp)
                      )
                      return response.choices[0].message.content
                  import requests, json
                  response = requests.post(
                      "https://api.groq.com/openai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {api_key_env}", "Content-Type": "application/json"},
                      json={"model": model, "messages": messages, "temperature": float(temp)},
                      timeout=60
                  )
                  return response.json()['choices'][0]['message']['content']
              if hasattr(gpt_utils, 'llm_completion'):
                  gpt_utils.llm_completion = groq_completion
              if hasattr(gpt_utils, 'gpt3Turbo_completion'):
                  gpt_utils.gpt3Turbo_completion = groq_completion
              print("✅ GPT utils patched with Groq")
          except Exception as e:
              print(f"⚠️ GPT patch failed: {e}")

          # Patch _editAndRenderShort for None images
          try:
              from shortGPT.engine import content_short_engine
              original_edit_render = content_short_engine.ShortEngine._editAndRenderShort
              def patched_edit_render(self):
                  if not hasattr(self, '_db_timed_image_urls') or self._db_timed_image_urls is None:
                      print("⚠️ _db_timed_image_urls is None - creating fallback images")
                      self._db_timed_image_urls = []
                      for i in range(1, 6):
                          img_path = f"fallback_image_{i}.png"
                          if os.path.exists(img_path) and os.path.getsize(img_path) > 100:
                              self._db_timed_image_urls.append((i * 5.5, img_path))
                          else:
                              self._db_timed_image_urls.append((i * 5.5, "test_background.mp4"))
                  if not isinstance(self._db_timed_image_urls, list):
                      if self._db_timed_image_urls:
                          self._db_timed_image_urls = list(self._db_timed_image_urls)
                      else:
                          self._db_timed_image_urls = []
                  print(f"📸 Using {len(self._db_timed_image_urls)} images")
                  return original_edit_render(self)
              content_short_engine.ShortEngine._editAndRenderShort = patched_edit_render
              print("✅ _editAndRenderShort patched")
          except Exception as e:
              print(f"⚠️ Edit render patch failed: {e}")

          # Patch _addYoutubeMetadata
          try:
              from shortGPT.engine import content_short_engine
              if hasattr(content_short_engine.ShortEngine, '_addYoutubeMetadata'):
                  original_metadata = content_short_engine.ShortEngine._addYoutubeMetadata
                  def patched_metadata(self):
                      if hasattr(self, '_db_video_path'):
                          video_path = self._db_video_path
                          if not os.path.exists(video_path) or os.path.getsize(video_path) < 100000:
                              print(f"⚠️ Video not found or too small: {video_path}")
                              assets_dir = os.path.dirname(video_path)
                              if os.path.exists(assets_dir):
                                  mp4_files = [f for f in os.listdir(assets_dir) if f.endswith('.mp4') and os.path.getsize(os.path.join(assets_dir, f)) > 100000]
                                  if mp4_files:
                                      fallback_video = os.path.join(assets_dir, mp4_files[0])
                                      print(f"🔄 Using fallback video: {fallback_video}")
                                      shutil.copy2(fallback_video, video_path)
                                      return original_metadata(self)
                              cmd = [
                                  'ffmpeg', '-y', '-f', 'lavfi', '-i', 'color=c=0x1a237e:s=1080x1920:d=60:r=30',
                                  '-vf', f"drawtext=text='{self._db_facts_type}':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=(h-text_h)/2",
                                  '-an', '-vcodec', 'libx264', '-pix_fmt', 'yuv420p', '-crf', '23', '-movflags', '+faststart',
                                  video_path
                              ]
                              subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                              print(f"✅ Created video at: {video_path}")
                      return original_metadata(self)
                  content_short_engine.ShortEngine._addYoutubeMetadata = patched_metadata
                  print("✅ _addYoutubeMetadata patched")
          except Exception as e:
              print(f"⚠️ Metadata patch failed: {e}")

          from shortGPT.audio.edge_voice_module import EdgeTTSVoiceModule
          from shortGPT.engine.facts_short_engine import FactsShortEngine
          from shortGPT.config.languages import Language

          custom_topic, content_type = get_content_type()
          topics = get_topics(content_type, custom_topic)
          
          emoji = "⚽" if content_type == "football" else "🔥"
          print(f"📋 Content Type: {content_type.upper()} {emoji}")
          print(f"📋 Topics: {topics}")

          for idx, topic in enumerate(topics[:3]):
              print(f"\n--- Generating video {idx+1}: {topic} ---")
              try:
                  voice_module = EdgeTTSVoiceModule(voiceName="en-US-ChristopherNeural")
                  
                  content_engine = FactsShortEngine(
                      voiceModule=voice_module,
                      facts_type=topic,
                      background_video_name="test_background.mp4",
                      background_music_name="test_audio.mp3",
                      num_images=5,
                      language=Language.ENGLISH
                  )
                  
                  print("🔄 Processing...")
                  engine_loop = content_engine.makeContent()
                  
                  while True:
                      try:
                          step_num, step_logs = next(engine_loop)
                          print(f"    [Step {step_num}/12]: {step_logs}")
                      except StopIteration:
                          break
                  
                  video_files = list(Path("videos").glob("*.mp4"))
                  if video_files:
                      latest_video = max(video_files, key=lambda x: x.stat().st_mtime)
                      if latest_video and os.path.getsize(latest_video) > 100000:
                          print(f"✅ Video rendered: {latest_video} ({os.path.getsize(latest_video):,} bytes)")
                      else:
                          print(f"⚠️ Video too small: {latest_video}")
                  
                  # Generate thumbnail
                  try:
                      if video_files:
                          latest_video = max(video_files, key=lambda x: x.stat().st_mtime)
                          if latest_video and os.path.getsize(latest_video) > 100000:
                              print(f"📸 Generating thumbnail for: {latest_video}")
                              thumbnail_path = latest_video.with_suffix('.png')
                              cmd = [
                                  'ffmpeg', '-y', '-ss', '00:00:01', '-i', str(latest_video),
                                  '-vframes', '1', '-vf', 'scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2',
                                  '-frames:v', '1', str(thumbnail_path)
                              ]
                              subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                              print(f"✅ Thumbnail created: {thumbnail_path}")
                  except Exception as thumb_err:
                      print(f"⚠️ Thumbnail generation failed: {thumb_err}")
                  
              except Exception as e:
                  print(f"❌ Failed to generate video for: {topic}")
                  print(f"❌ Error: {e}")
                  traceback.print_exc()
                  continue

          print("🎉 All videos rendered!")

      - name: Verify and Fix Rendered Videos
        if: always()
        run: |
          echo "========================================================="
          echo "📁 RENDERED VIDEO FILES:"
          echo "========================================================="
          ls -la videos/ 2>/dev/null || echo "No videos directory found"
          echo ""
          echo "📊 File sizes:"
          find videos/ -name "*.mp4" -exec ls -lh {} \; 2>/dev/null || echo "No MP4 files found"
          
          for video in videos/*.mp4; do
            if [ -f "$video" ]; then
              SIZE=$(stat -c%s "$video" 2>/dev/null || echo "0")
              if [ "$SIZE" -lt 10240 ]; then
                echo "❌ Corrupt video: $video ($SIZE bytes) - removing..."
                rm -f "$video"
              fi
            fi
          done
          
          if [ -z "$(find videos/ -name '*.mp4' -size +10240c 2>/dev/null)" ]; then
            echo "⚠️ No valid videos found. Creating fallback video..."
            ffmpeg -f lavfi -i color=c=0x1a237e:s=1080x1920:d=60:r=30 \
                   -vf "drawtext=text='Amazing Facts':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=(h-text_h)/2" \
                   -c:v libx264 -pix_fmt yuv420p -crf 23 -movflags +faststart \
                   videos/fallback_video.mp4
            echo "✅ Created fallback video"
          fi
          echo "========================================================="

      - name: Convert Videos for YouTube Shorts
        if: success()
        run: |
          for VIDEO in videos/*.mp4; do
            if [ ! -f "$VIDEO" ]; then continue; fi
            SIZE=$(stat -c%s "$VIDEO" 2>/dev/null || echo "0")
            if [ "$SIZE" -lt 10240 ]; then
              echo "⚠️ Skipping corrupt video: $VIDEO"
              continue
            fi
            
            OUTPUT="videos/shorts_$(basename "$VIDEO")"
            ffmpeg -y -i "$VIDEO" -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 -preset medium -crf 23 -c:a aac -b:a 128k -r 30 -movflags +faststart -pix_fmt yuv420p "$OUTPUT"
            if [ -f "$OUTPUT" ] && [ $(stat -c%s "$OUTPUT" 2>/dev/null || echo "0") -gt 10240 ]; then
              mv "$OUTPUT" "$VIDEO"
              echo "✅ Converted: $VIDEO"
            fi
          done

      - name: Upload Videos to YouTube
        if: success()
        env:
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TOKEN_PICKLE: ${{ secrets.TOKEN_PICKLE }}
        run: |
          if [ -n "$CLIENT_SECRET" ]; then
            echo "$CLIENT_SECRET" | base64 -d > client_secret.json
          else
            echo "❌ No CLIENT_SECRET"
            exit 1
          fi
          if [ -n "$TOKEN_PICKLE" ]; then
            echo "$TOKEN_PICKLE" | base64 -d > token.pickle
          else
            echo "❌ No TOKEN_PICKLE"
            exit 1
          fi

          for VIDEO in videos/*.mp4; do
            if [ ! -f "$VIDEO" ]; then continue; fi
            SIZE=$(stat -c%s "$VIDEO" 2>/dev/null || echo "0")
            if [ "$SIZE" -lt 10240 ]; then
              echo "❌ Skipping corrupt video: $VIDEO"
              continue
            fi
            export LATEST_VIDEO="$VIDEO"
            echo "📤 Uploading: $VIDEO"
            echo "📊 Size: $(du -h "$VIDEO" | cut -f1)"
            
            python3 -c "
import os, sys, pickle
from google.auth.transport.requests import Request
from googleapiclient.discovery import build
from googleapiclient.http import MediaFileUpload

video_path = os.environ.get('LATEST_VIDEO')
if not video_path or not os.path.exists(video_path):
    sys.exit(1)

with open('token.pickle', 'rb') as f:
    creds = pickle.load(f)

if creds and creds.expired and creds.refresh_token:
    creds.refresh(Request())

youtube = build('youtube', 'v3', credentials=creds)

title = os.path.basename(video_path).replace('.mp4', '').replace('shorts_', '').replace('test_background_', '')
if len(title) > 80:
    title = title[:80]
if not title or title.startswith('2026'):
    title = 'Amazing Facts - ShortGPT'

body = {
    'snippet': {
        'title': title[:100],
        'description': 'Generated by ShortGPT.\n\n#shorts #facts #viral #trending #football',
        'tags': ['shorts', 'facts', 'trending', 'football'],
        'categoryId': '22'
    },
    'status': {'privacyStatus': 'public', 'selfDeclaredMadeForKids': False}
}

media = MediaFileUpload(video_path, chunksize=-1, resumable=True)
request = youtube.videos().insert(part='snippet,status', body=body, media_body=media)
response = None
while response is None:
    status, response = request.next_chunk()
    if status:
        print(f'📊 Progress: {int(status.progress() * 100)}%')
print(f'✅ Uploaded: https://youtu.be/{response['id']}')
"
          done

      - name: Upload Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: videos/*.mp4
          retention-days: 7

      - name: Complete
        if: always()
        run: |
          echo "========================================================="
          echo "🎉 WORKFLOW COMPLETE!"
          echo "========================================================="
          ls -la videos/ 2>/dev/null || echo "No videos found"
          echo "========================================================="
