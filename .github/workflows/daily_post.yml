name: Daily YouTube Automation

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *' # runs 5 times a day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick jq
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Verify FFmpeg installation
        run: |
          which ffmpeg
          ffmpeg -version

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-generativeai==0.5.0   # ✅ pinned Gemini client library

      - name: Fix Python path
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Check Gemini Key Presence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY is empty"
            exit 1
          else
            echo "✅ GEMINI_API_KEY is set"
            echo "Length: ${#GEMINI_API_KEY}"
          fi

      - name: Run ShortGPT Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash   # ✅ Updated to active model version
          OPENAI_MODEL: gpt-4o-mini
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "Using GEMINI_MODEL=$GEMINI_MODEL"
          python run_automation.py
