name: Daily YouTube Automation

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *' # runs 5 times a day
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom topic (leave empty for random)'
        required: false
        default: ''
      content_type:
        description: 'Content type: random, football, trending'
        required: false
        default: 'random'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick jq curl fonts-liberation fonts-dejavu-core fonts-freefont-ttf
          
          # Complete neutralization of restrictive ImageMagick font/path security policies
          for policy in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
            if [ -f "$policy" ]; then
              echo "Applying security bypass patch to: $policy"
              sudo sed -i 's/domain="path" rights="none"/domain="path" rights="read|write"/g' "$policy" || true
              sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/g' "$policy" || true
              sudo sed -i 's/domain="coder" rights="none" pattern="LABEL"/domain="coder" rights="read|write" pattern="LABEL"/g' "$policy" || true
              sudo sed -i 's/domain="coder" rights="none" pattern="TEXT"/domain="coder" rights="read|write" pattern="TEXT"/g' "$policy" || true
            fi
          done

      - name: Verify FFmpeg installation
        run: |
          which ffmpeg
          ffmpeg -version

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip setuptools wheel
          
          # Install torch CPU-only first
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          
          # CRITICAL: Downgrade openai to 0.28.0 for ShortGPT compatibility
          pip install --no-cache-dir "protobuf>=3.20.1,<5.0.0dev" "Pillow<10.0.0" "moviepy<2.0.0" "openai==0.28.0" "numpy<2.0.0"
          
          # Install core video pipeline components
          pip install --no-cache-dir yt-dlp tiktoken python-dotenv pandas tinydb tinymongo progress speechrecognition edge-tts wrapping ffmpeg-python whisper-timestamped openai-whisper
          
          # Install YouTube API dependencies
          pip install --no-cache-dir google-api-python-client google-auth-oauthlib google-auth-httplib2
          
          # Install google-generativeai
          pip install --no-cache-dir google-generativeai
          
          # Install pyyaml (needed for config)
          pip install --no-cache-dir pyyaml
          
          # Install requests for fallbacks and trending topics
          pip install --no-cache-dir requests beautifulsoup4 newsapi-python google-trends-api
          
          # Force clean install shortGPT
          pip install --no-cache-dir --no-deps --ignore-installed shortGPT

      - name: Fix Python path
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Create Local Background Assets
        run: |
          # Generate a 300-second background video (5 minutes) - ensures it's never "too short"
          ffmpeg -f lavfi -i color=c=0x1a237e:s=1080x1920:d=300:r=30 \
                 -vf "drawtext=text='Amazing Facts':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=(h-text_h)/2,drawtext=text='Discover More':fontcolor=#64b5f6:fontsize=36:x=(w-text_w)/2:y=(h-text_h)/2+80" \
                 -an -vcodec libx264 -pix_fmt yuv420p -crf 23 -movflags +faststart test_background.mp4
          
          # Create audio track
          ffmpeg -f lavfi -i "sine=frequency=432:duration=300:sample_rate=44100" \
                 -af "volume=0.3" \
                 -acodec libmp3lame -b:a 128k test_audio.mp3
          
          echo "✅ Local assets created (300 seconds):"
          ls -lh test_background.mp4 test_audio.mp3

      - name: Create Fallback Images
        run: |
          for i in 1 2 3 4 5; do
            ffmpeg -f lavfi -i color=c=0x1a237e:s=1080x1920:d=1:r=1 \
                   -vf "drawtext=text='Fact $i':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=(h-text_h)/2" \
                   -frames:v 1 "fallback_image_$i.png"
          done
          echo "✅ Created fallback images"

      - name: Run ShortGPT Automation (Football + Trending Only)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_BASE: "https://api.groq.com/openai/v1"
          OPENAI_MODEL: "llama-3.1-8b-instant"
          FORCE_GROQ: "true"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IMAGEMAGICK_BINARY: "/usr/bin/convert"
          SHORTGPT_NICHE: "Trending Topics"
          SHORTGPT_LANG: "English"
          SHORTGPT_VOICE: "en-US-ChristopherNeural"
          CUSTOM_TOPIC: ${{ github.event.inputs.topic || '' }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type || 'random' }}
        shell: python
        run: |
          import os
          import sys
          import time
          import traceback
          import subprocess
          import shutil
          import json
          import random
          from pathlib import Path
          from datetime import datetime

          # Force-inject API key options
          api_key_env = os.getenv("GROQ_API_KEY") or os.getenv("OPENAI_API_KEY")
          if api_key_env:
              os.environ["OPENAI_API_KEY"] = api_key_env
              os.environ["GROQ_API_KEY"] = api_key_env
          else:
              print("❌ ABORT: Missing critical GROQ_API_KEY secret.")
              sys.exit(1)

          # Ensure user-installed packages are explicitly added to the Python path
          import site
          user_site = site.getusersitepackages()
          if user_site not in sys.path:
              sys.path.insert(0, user_site)

          # Ensure local repository path layouts take precedence
          _here = Path('.' if '__file__' not in locals() else __file__).parent.resolve()
          if str(_here) not in sys.path:
              sys.path.insert(0, str(_here))

          # =====================================================================
          # RANDOM TOPIC SELECTOR (Football or Trending only)
          # =====================================================================
          def get_random_content_type():
              """Randomly select between football and trending"""
              content_type = os.getenv("CONTENT_TYPE", "random").lower()
              custom_topic = os.getenv("CUSTOM_TOPIC", "").strip()
              
              # If custom topic is provided, use it
              if custom_topic:
                  print(f"📝 Using custom topic: {custom_topic}")
                  return custom_topic, "custom"
              
              # If content_type is specified and not random, use it
              if content_type in ["football", "trending"]:
                  print(f"📝 Using specified content type: {content_type}")
                  return None, content_type
              
              # Random selection between football and trending only
              types = ["football", "trending"]
              selected = random.choice(types)
              print(f"🎲 Randomly selected: {selected}")
              return None, selected

          def get_trending_topics(content_type, custom_topic=None):
              """Fetch trending topics from various sources"""
              topics = []
              
              # If custom topic is provided, use it
              if custom_topic:
                  print(f"📝 Using custom topic: {custom_topic}")
                  return [custom_topic]
              
              print(f"🔍 Fetching {content_type} topics...")
              
              try:
                  # === FOOTBALL TOPICS ===
                  if content_type == "football":
                      football_topics = [
                          "2014 World Cup highlights",
                          "Vintage football legends 2014",
                          "Classic football matches 2014",
                          "Football history moments",
                          "Retro football goals 2014",
                          "2014 Brazil World Cup best moments",
                          "Football legends 2014 and before",
                          "Iconic football goals 2014",
                          "World Cup 2014 moments",
                          "Vintage football skills",
                          "Classic football players 2014",
                          "Memorable football matches 2014",
                          "Football history 2014 World Cup",
                          "Legendary football goals 2014",
                          "Retro football highlights",
                          "2014 World Cup unforgettable moments",
                          "Football icons of 2014",
                          "Classic football rivalries 2014",
                          "Vintage football matches 2014",
                          "World Cup 2014 best goals"
                      ]
                      topics = random.sample(football_topics, min(3, len(football_topics)))
                      print(f"⚽ Football topics: {topics}")
                      return topics
                  
                  # === TRENDING TOPICS ===
                  else:
                      try:
                          from newsapi import NewsApiClient
                          
                          newsapi_key = os.getenv("NEWS_API_KEY", "")
                          if newsapi_key:
                              newsapi = NewsApiClient(api_key=newsapi_key)
                              headlines = newsapi.get_top_headlines(
                                  category='general',
                                  language='en',
                                  country='us'
                              )
                              for article in headlines.get('articles', [])[:5]:
                                  if article.get('title'):
                                      topics.append(article['title'].split(' - ')[0][:100])
                              if topics:
                                  print(f"📰 News topics: {topics}")
                                  return topics
                      except Exception as e:
                          print(f"⚠️ News API failed: {e}")
                      
                      # Fallback trending topics
                      fallback_topics = [
                          "Latest technology breakthroughs",
                          "Amazing science discoveries",
                          "Mind-blowing facts about space",
                          "Incredible animal facts",
                          "Surprising historical events",
                          "Future technology predictions",
                          "Hidden secrets of the universe",
                          "Incredible human achievements",
                          "Amazing nature phenomena",
                          "Scientific discoveries 2025",
                          "Technology innovations 2025",
                          "Space exploration discoveries",
                          "Artificial intelligence breakthroughs",
                          "Solar system discoveries",
                          "Ancient mysteries revealed"
                      ]
                      topics = random.sample(fallback_topics, min(3, len(fallback_topics)))
                      print(f"🔥 Trending topics: {topics}")
                      return topics
                      
              except Exception as e:
                  print(f"❌ Error fetching topics: {e}")
                  return ["Amazing science facts", "Incredible discoveries", "Mind-blowing facts"]

          # =====================================================================
          # CRITICAL: Setup for Groq API
          # =====================================================================
          import openai
          
          # Set the API key and base URL for the old-style client
          openai.api_key = api_key_env
          openai.api_base = "https://api.groq.com/openai/v1"
          
          # Also set up modern client
          modern_client = None
          try:
              from openai import OpenAI as ModernOpenAI
              modern_client = ModernOpenAI(
                  api_key=api_key_env,
                  base_url="https://api.groq.com/openai/v1"
              )
              print("✅ Modern OpenAI client configured")
          except ImportError:
              print("⚠️ Modern OpenAI client not available")

          def handle_soft_landing(error_message):
              print("\n🟩 [AUTOMATION SOFT LANDING]: API Quota or Service Ceiling Intercepted.")
              print(f"🟩 Details: {error_message}")
              print("🟩 Exiting cleanly with status code 0 to keep the automation workflow healthy...")
              sys.exit(0)

          # =====================================================================
          # PATCH SHORTGPT FOR YOUTUBE FOOTAGE
          # =====================================================================
          try:
              from shortGPT.api_utils import youtube_api
              
              def search_youtube_videos(query, max_results=5, year_filter=None):
                  """Search YouTube for videos with optional year filter"""
                  try:
                      if year_filter:
                          query = f"{query} before:{year_filter}"
                      return youtube_api.search_videos_YouTube(query, max_results)
                  except Exception as e:
                      print(f"⚠️ YouTube search failed: {e}")
                      return []
              
              print("✅ YouTube API integration ready")
              
          except Exception as youtube_patch_err:
              print(f"⚠️ YouTube patch notice: {youtube_patch_err}")

          # =====================================================================
          # CRITICAL FIX: Patch MoviePy TextClip to use a valid font
          # =====================================================================
          try:
              import moviepy.video.VideoClip as videoclip
              
              original_textclip = videoclip.TextClip
              
              class PatchedTextClip(original_textclip):
                  def __init__(self, *args, **kwargs):
                      # Override the font to use Liberation Sans (available on Ubuntu)
                      if 'font' not in kwargs or kwargs['font'] is None:
                          kwargs['font'] = 'Liberation-Sans-Bold'
                      
                      # Also handle font if it's a list or tuple
                      if 'font' in kwargs and isinstance(kwargs['font'], (list, tuple)):
                          # Use the first available font from the list
                          available_fonts = ['Liberation-Sans-Bold', 'DejaVu-Sans-Bold', 'FreeSans']
                          for font in available_fonts:
                              try:
                                  kwargs['font'] = font
                                  break
                              except:
                                  continue
                      
                      # If the font is None or empty, use default
                      if not kwargs.get('font'):
                          kwargs['font'] = 'Liberation-Sans-Bold'
                      
                      # Always use a valid font
                      print(f"🔤 [TEXTCLIP PATCH] Creating text with font: {kwargs.get('font')}")
                      
                      try:
                          super().__init__(*args, **kwargs)
                      except Exception as e:
                          print(f"⚠️ TextClip creation failed: {e}")
                          # Try with a different font
                          kwargs['font'] = 'DejaVu-Sans-Bold'
                          try:
                              super().__init__(*args, **kwargs)
                          except:
                              kwargs['font'] = 'FreeSans'
                              super().__init__(*args, **kwargs)
              
              # Replace the TextClip class
              videoclip.TextClip = PatchedTextClip
              print("✅ MoviePy TextClip patched with valid fonts")
              
          except Exception as text_patch_err:
              print(f"⚠️ TextClip patch notice: {text_patch_err}")

          # =====================================================================
          # CRITICAL FIX: Directly patch the video extraction function
          # =====================================================================
          try:
              import shortGPT.editing_utils.handle_videos as handle_videos
              
              def patched_extract_random_clip(video_path, duration, target_duration, output_path):
                  """Completely replace the extraction function"""
                  print(f"🎬 [PATCHED] Extracting clip from {video_path}")
                  print(f"   Duration: {duration}, Target: {target_duration}")
                  
                  try:
                      os.makedirs(os.path.dirname(output_path), exist_ok=True)
                      
                      if "test_background.mp4" in str(video_path):
                          print(f"🎬 Using local test_background.mp4 for clip extraction")
                          
                          cmd = [
                              'ffmpeg', '-y', '-ss', '0', '-i', video_path,
                              '-t', str(target_duration), '-an', '-vcodec', 'libx264',
                              '-crf', '23', '-pix_fmt', 'yuv420p', '-movflags', '+faststart',
                              output_path
                          ]
                          subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          
                          if os.path.exists(output_path) and os.path.getsize(output_path) > 1000:
                              print(f"✅ Clip extracted successfully: {output_path}")
                              return output_path
                      
                      print(f"🛠️ Generating synthetic video as fallback...")
                      cmd = [
                          'ffmpeg', '-y', '-f', 'lavfi', '-i', f'color=c=0x1a237e:s=1080x1920:d={target_duration}:r=30',
                          '-an', '-vcodec', 'libx264', '-pix_fmt', 'yuv420p', '-movflags', '+faststart',
                          output_path
                      ]
                      subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      
                      if os.path.exists(output_path) and os.path.getsize(output_path) > 1000:
                          print(f"✅ Synthetic clip created: {output_path}")
                          return output_path
                      
                      raise Exception("Failed to create clip")
                      
                  except Exception as e:
                      print(f"❌ Clip extraction failed: {e}")
                      try:
                          shutil.copy2(video_path, output_path)
                          return output_path
                      except:
                          cmd = [
                              'ffmpeg', '-y', '-f', 'lavfi', '-i', f'color=c=blue:s=1080x1920:d={target_duration}:r=25',
                              '-an', '-vcodec', 'libx264', '-pix_fmt', 'yuv420p', '-movflags', '+faststart',
                              output_path
                          ]
                          subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          return output_path
              
              handle_videos.extract_random_clip_from_video = patched_extract_random_clip
              print("✅ Video extraction function replaced successfully")
              
          except Exception as clip_patch_err:
              print(f"⚠️ Clip patch notice: {clip_patch_err}")

          # =====================================================================
          # CRITICAL FIX: Override the AssetDatabase to use local files
          # =====================================================================
          try:
              from shortGPT.config import asset_db
              
              class PatchedAssetDatabase:
                  @staticmethod
                  def get_asset_link(key):
                      key_str = str(key).lower()
                      print(f"🔍 Asset request for: '{key_str}'")
                      
                      if "subscribe" in key_str or "animation" in key_str:
                          print(f"⚠️ Subscribe animation requested, returning synthetic")
                          if os.path.exists("test_background.mp4"):
                              return "test_background.mp4"
                          return "fallback_background_video.mp4"
                      
                      if "video" in key_str or "background" in key_str:
                          if os.path.exists("test_background.mp4") and os.path.getsize("test_background.mp4") > 100000:
                              print(f"✅ Using local test_background.mp4")
                              return "test_background.mp4"
                      
                      if "music" in key_str or "audio" in key_str:
                          if os.path.exists("test_audio.mp3") and os.path.getsize("test_audio.mp3") > 10000:
                              print(f"✅ Using local test_audio.mp3")
                              return "test_audio.mp3"
                      
                      return "test_background.mp4"
                  
                  @staticmethod
                  def get_asset_duration(key):
                      return 300.0
                  
                  @staticmethod
                  def get_asset_name(key):
                      return str(key)
              
              if hasattr(asset_db, 'AssetDatabase'):
                  asset_db.AssetDatabase.get_asset_link = PatchedAssetDatabase.get_asset_link
                  asset_db.AssetDatabase.get_asset_duration = PatchedAssetDatabase.get_asset_duration
                  print("✅ AssetDatabase patched to use local files")
                  
          except Exception as db_patch_err:
              print(f"⚠️ Database patch notice: {db_patch_err}")

          # =====================================================================
          # PATCH SHORTGPT GPT UTILS
          # =====================================================================
          try:
              from shortGPT.gpt import gpt_utils
              
              def groq_completion(*args, **kwargs):
                  """Handle both chat_prompt and prompt parameter styles"""
                  # Extract the prompt
                  chat_prompt = kwargs.get('chat_prompt') or kwargs.get('prompt')
                  
                  # If no prompt in kwargs, check positional args
                  if chat_prompt is None and len(args) > 0:
                      chat_prompt = args[0]
                  
                  # Extract system message
                  system = kwargs.get('system', '')
                  if system is None:
                      system = ''
                  
                  # Extract temperature
                  temp = kwargs.get('temp', kwargs.get('temperature', 1.0))
                  if temp is None:
                      temp = 1.0
                  
                  # Extract model
                  model = kwargs.get('model', os.getenv("OPENAI_MODEL", "llama-3.1-8b-instant"))
                  
                  print(f"🤖 Groq completion called with prompt: {str(chat_prompt)[:50]}...")
                  
                  try:
                      messages = []
                      if system:
                          messages.append({"role": "system", "content": system})
                      messages.append({"role": "user", "content": chat_prompt})
                      
                      # Try modern client first
                      if modern_client:
                          response = modern_client.chat.completions.create(
                              model=model,
                              messages=messages,
                              temperature=float(temp)
                          )
                          return response.choices[0].message.content
                      
                      # Fallback: use requests directly to Groq
                      import requests
                      import json
                      
                      url = "https://api.groq.com/openai/v1/chat/completions"
                      headers = {
                          "Authorization": f"Bearer {api_key_env}",
                          "Content-Type": "application/json"
                      }
                      payload = {
                          "model": model,
                          "messages": messages,
                          "temperature": float(temp)
                      }
                      
                      response = requests.post(url, headers=headers, json=payload, timeout=60)
                      if response.status_code == 200:
                          data = response.json()
                          return data['choices'][0]['message']['content']
                      else:
                          raise Exception(f"Groq API error: {response.status_code} - {response.text}")
                          
                  except Exception as e:
                      if "429" in str(e) or "quota" in str(e).lower():
                          handle_soft_landing(str(e))
                      print(f"❌ Groq completion error: {e}")
                      raise e
              
              # Replace both functions with our unified version
              if hasattr(gpt_utils, 'llm_completion'):
                  gpt_utils.llm_completion = groq_completion
                  print("✅ GPT utils llm_completion replaced with Groq")
              
              if hasattr(gpt_utils, 'gpt3Turbo_completion'):
                  gpt_utils.gpt3Turbo_completion = groq_completion
                  print("✅ GPT utils gpt3Turbo_completion replaced with Groq")
                  
          except Exception as gpt_patch_err:
              print(f"⚠️ GPT patch notice: {gpt_patch_err}")

          # =====================================================================
          # IMPORT SHORTGPT MODULES
          # =====================================================================
          from shortGPT.config.asset_db import AssetDatabase
          from shortGPT.audio.edge_voice_module import EdgeTTSVoiceModule
          from shortGPT.engine.facts_short_engine import FactsShortEngine
          from shortGPT.config.languages import Language

          def get_automation_settings():
              return {
                  "language": os.getenv("SHORTGPT_LANG", "English"),
                  "voice": os.getenv("SHORTGPT_VOICE", "en-US-ChristopherNeural"), 
                  "niche_topic": os.getenv("SHORTGPT_NICHE", "Trending Topics"),
              }

          def sanitize_numpy_types(obj):
              import numpy as np
              if isinstance(obj, dict):
                  return {k: sanitize_numpy_types(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [sanitize_numpy_types(x) for x in obj]
              elif isinstance(obj, (np.float64, np.float32)):
                  return float(obj)
              elif isinstance(obj, (np.int64, np.int32)):
                  return int(obj)
              return obj

          def main():
              print("=========================================================")
              print("🚀 STARTING SHORTGPT AUTOMATION PIPELINE")
              print("=========================================================")

              custom_topic, content_type = get_random_content_type()
              topics = get_trending_topics(content_type, custom_topic)
              
              if not topics:
                  topics = ["Amazing science facts", "Incredible discoveries"]
              
              emojis = {
                  "football": "⚽",
                  "trending": "🔥",
                  "custom": "📝"
              }
              emoji = emojis.get(content_type, "🎬")
              
              print(f"📋 Content Type: {content_type.upper()} {emoji}")
              print(f"📋 Topics to generate: {topics}")
              
              # Generate a video for each topic
              for idx, topic in enumerate(topics[:3]):  # Max 3 videos per run
                  print(f"\n--- Generating video {idx+1}/{min(3, len(topics))}: {topic} ---")
                  
                  try:
                      # Create a specific background for this topic
                      topic_slug = topic.replace(' ', '_').replace("'", "")[:30]
                      bg_video = f"test_background_{topic_slug}.mp4"
                      
                      # Copy the base background or create a new one
                      if os.path.exists("test_background.mp4"):
                          shutil.copy2("test_background.mp4", bg_video)
                      
                      # Generate title from topic
                      if content_type == "football":
                          title = f"⚽ Vintage Football {topic} - ShortGPT"
                      else:
                          title = f"🔥 {topic} - ShortGPT"
                      
                      local_video = bg_video
                      local_audio = "test_audio.mp3"
                      
                      if not os.path.exists(local_video) or os.path.getsize(local_video) < 100000:
                          print("⚠️ Creating background video (300 seconds)...")
                          cmd = [
                              'ffmpeg', '-y', '-f', 'lavfi', '-i', 'color=c=0x1a237e:s=1080x1920:d=300:r=30',
                              '-an', '-vcodec', 'libx264', '-pix_fmt', 'yuv420p', '-movflags', '+faststart',
                              local_video
                          ]
                          subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      
                      if not os.path.exists(local_audio) or os.path.getsize(local_audio) < 10000:
                          print("⚠️ Creating test_audio.mp3...")
                          subprocess.run([
                              'ffmpeg', '-y', '-f', 'lavfi', '-i', 'sine=frequency=432:duration=300:sample_rate=44100',
                              '-af', 'volume=0.3', '-acodec', 'libmp3lame', '-b:a', '128k', local_audio
                          ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      
                      print(f"📁 Local assets for {topic}:")
                      if os.path.exists(local_video):
                          print(f"   - {local_video}: {os.path.getsize(local_video):,} bytes")
                      
                      settings = get_automation_settings()
                      language = settings["language"]
                      voice_choice = settings["voice"]

                      try:
                          lang_enum = Language.from_string(language)
                      except Exception:
                          print(f"⚠️ Language defaulting to English")
                          lang_enum = Language.ENGLISH

                      voice_module = EdgeTTSVoiceModule(voiceName=voice_choice)

                      print(f"🎬 Generating {content_type} video for: {topic}")
                      
                      content_engine = FactsShortEngine(
                          voiceModule=voice_module,
                          facts_type=topic,
                          background_video_name=local_video,
                          background_music_name=local_audio,
                          num_images=5,  # SHOW IMAGES IN VIDEO
                          language=lang_enum
                      )

                      print("🔄 Processing...")
                      engine_loop = content_engine.makeContent()
                      
                      while True:
                          try:
                              if hasattr(content_engine, 'caption_timing_map') and content_engine.caption_timing_map:
                                  content_engine.caption_timing_map = sanitize_numpy_types(content_engine.caption_timing_map)
                              
                              step_num, step_logs = next(engine_loop)
                              print(f"    [Step {step_num}/12]: {step_logs}")
                              
                          except StopIteration:
                              break

                      print(f"✅ SUCCESS! Video rendered for: {topic}")
                      
                      # Generate thumbnail
                      try:
                          latest_video = None
                          video_files = list(Path("videos").glob("*.mp4"))
                          if video_files:
                              latest_video = max(video_files, key=lambda x: x.stat().st_mtime)
                              if latest_video:
                                  print(f"📸 Generating thumbnail for: {latest_video}")
                                  thumbnail_path = latest_video.with_suffix('.png')
                                  cmd = [
                                      'ffmpeg', '-y', '-ss', '00:00:01', '-i', str(latest_video),
                                      '-vframes', '1', '-vf', 'scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2',
                                      '-frames:v', '1', str(thumbnail_path)
                                  ]
                                  subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                                  print(f"✅ Thumbnail created: {thumbnail_path}")
                      except Exception as thumb_err:
                          print(f"⚠️ Thumbnail generation failed: {thumb_err}")

                  except Exception as video_failure:
                      err_str = str(video_failure)
                      if "429" in err_str or "Quota exceeded" in err_str:
                          handle_soft_landing(err_str)
                      print(f"❌ Failed to generate video for: {topic}")
                      print(f"❌ Error: {video_failure}")
                      traceback.print_exc()
                      continue

              print("\n=========================================================")
              print("🎉 SUCCESS! All videos rendered successfully!")
              print("=========================================================")

          main()

      - name: Verify and Fix Rendered Videos
        if: always()
        run: |
          echo "========================================================="
          echo "📁 RENDERED VIDEO FILES:"
          echo "========================================================="
          ls -la videos/ 2>/dev/null || echo "No videos directory found"
          echo ""
          echo "📊 File sizes:"
          find videos/ -name "*.mp4" -exec ls -lh {} \; 2>/dev/null || echo "No MP4 files found"
          
          # Fix any corrupt videos
          for video in videos/*.mp4; do
            if [ -f "$video" ]; then
              FILE_SIZE=$(stat -c%s "$video" 2>/dev/null || stat -f%z "$video" 2>/dev/null || echo "0")
              if [ "$FILE_SIZE" -lt 10240 ]; then
                echo "❌ Corrupt video: $video ($FILE_SIZE bytes) - removing..."
                rm -f "$video"
              fi
            fi
          done
          echo "========================================================="

      - name: Convert Videos for YouTube Shorts Compatibility
        if: success()
        run: |
          for RENDERED_VIDEO in videos/*.mp4; do
            if [ ! -f "$RENDERED_VIDEO" ]; then
              continue
            fi
            
            echo "📹 Converting $RENDERED_VIDEO for YouTube Shorts..."
            
            # Convert to YouTube Shorts format
            OUTPUT_VIDEO="videos/shorts_ready_$(basename "$RENDERED_VIDEO")"
            
            ffmpeg -y -i "$RENDERED_VIDEO" \
              -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-iw)/2" \
              -c:v libx264 \
              -preset medium \
              -crf 23 \
              -c:a aac \
              -b:a 128k \
              -r 30 \
              -movflags +faststart \
              -pix_fmt yuv420p \
              "$OUTPUT_VIDEO"
            
            # Check if conversion succeeded
            if [ -f "$OUTPUT_VIDEO" ] && [ $(stat -c%s "$OUTPUT_VIDEO" 2>/dev/null || stat -f%z "$OUTPUT_VIDEO" 2>/dev/null || echo "0") -gt 10240 ]; then
              mv "$OUTPUT_VIDEO" "$RENDERED_VIDEO"
              echo "✅ Video converted for YouTube Shorts"
              echo "📊 New size: $(du -h "$RENDERED_VIDEO" | cut -f1)"
            else
              echo "⚠️ Conversion failed for $RENDERED_VIDEO"
              rm -f "$OUTPUT_VIDEO"
            fi
          done

