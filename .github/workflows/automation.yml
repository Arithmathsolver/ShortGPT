import os
import sys
import time
import traceback
from pathlib import Path

# Ensure local repository path layouts take precedence in memory
_here = Path(__file__).parent.resolve()
if str(_here) not in sys.path:
    sys.path.insert(0, str(_here))

# Force backend configuration variables to map to Groq if OpenAI-compatible wrappers are hit
if os.getenv("OPENAI_API_KEY") and not os.getenv("OPENAI_API_BASE"):
    os.environ["OPENAI_API_BASE"] = "https://api.groq.com/openai/v1"

# =====================================================================
# 🛡️ THE ULTIMATE LOW-LEVEL GEMINI-TO-GROQ FAILOVER PATCH
# This hooks directly into the core `llm_completion` function. 
# If Gemini throws a 429 or Quota limit at ANY point, it seamlessly
# shifts that specific request to Groq without crashing the loop.
# =====================================================================
try:
    from shortGPT.gpt import gpt_utils
    from shortGPT.gpt.gpt_utils import gpt3_5_turbo_completion
    
    if hasattr(gpt_utils, 'llm_completion') and not hasattr(gpt_utils, '_patched_llm_completion'):
        gpt_utils._original_llm_completion = gpt_utils.llm_completion
        gpt_utils._patched_llm_completion = True
        
        def smart_failover_llm_completion(chat_prompt, system="", temp=1, model=None):
            try:
                # 1. Try normal execution (Gemini)
                return gpt_utils._original_llm_completion(chat_prompt, system, temp, model)
            except Exception as e:
                err_msg = str(e)
                # 2. Catch Gemini rate limits or quota walls
                if "429" in err_msg or "Quota exceeded" in err_msg or "ResourceExhausted" in err_msg:
                    print("\n🛑 [GEMINI LIMIT HIT]: Intercepted quota wall inside core gpt_utils.")
                    print("🔄 AUTOMATIC OVERRIDE: Rerouting this text completion request via Groq...")
                    
                    # Construct the combined layout expected by the OpenAI/Groq engine wrapper
                    combined_prompt = f"{system}\n\n{chat_prompt}" if system else chat_prompt
                    
                    # Force model configuration parameters to use Groq's open-source model variable
                    os.environ["OPENAI_MODEL"] = "llama-3.1-8b-instant"
                    
                    # Execute using shortGPT's built-in OpenAI function layer redirected to Groq
                    return gpt3_5_turbo_completion(combined_prompt)
                else:
                    # If it's another kind of error, bubble it up
                    raise e
                    
        gpt_utils.llm_completion = smart_failover_llm_completion
        print("✅ Global Text Optimization: Core gpt_utils engine failover protection active.")
except Exception as patch_err:
    print(f"⚠️ Low-level text routing patch notice: {patch_err}")
# =====================================================================

from shortGPT.config.api_db import ApiKeyManager
from shortGPT.config.asset_db import AssetDatabase
from shortGPT.audio.edge_voice_module import EdgeTTSVoiceModule
from shortGPT.engine.facts_short_engine import FactsShortEngine

def get_automation_settings():
    return {
        "language": os.getenv("SHORTGPT_LANG", "English"),
        "voice": os.getenv("SHORTGPT_VOICE", "en-US-ChristopherNeural"), 
        "niche_topic": os.getenv("SHORTGPT_NICHE", "Deep Sea Mysteries"),
        "channels_amount": int(os.getenv("SHORTGPT_BATCH_COUNT", "1")),
        "use_images": os.getenv("SHORTGPT_USE_IMAGES", "False").lower() == "true"
    }

def sanitize_numpy_types(obj):
    """
    Recursively scans and normalizes numpy data types (like np.float64) 
    into standard Python native types to protect moviepy asset tracking layers.
    """
    import numpy as np
    if isinstance(obj, dict):
        return {k: sanitize_numpy_types(v) for k, v in obj.items()}
    elif isinstance(obj, list):
        return [sanitize_numpy_types(x) for x in obj]
    elif isinstance(obj, (np.float64, np.float32)):
        return float(obj)
    elif isinstance(obj, (np.int64, np.int32)):
        return int(obj)
    return obj

def main():
    print("=========================================================")
    print("🚀 STARTING AUTOMATED SHORTGPT MEDIA PIPELINE GENERATION ")
    print("=========================================================")

    try:
        AssetDatabase.initialize_db()
        AssetDatabase.sync_local_assets() 
        print("✅ Asset Database abstraction layers synchronized successfully.")
    except Exception as db_err:
        print(f"⚠️ Database initialization notice: {db_err} (Proceeding...)")

    settings = get_automation_settings()
    topic = settings["niche_topic"]
    language = settings["language"]
    voice_choice = settings["voice"]

    print(f"\n📋 Pipeline Execution Settings:")
    print(f"  • Selected Niche Category : {topic}")
    print(f"  • Target Native Language  : {language}")
    print(f"  • TTS Voice Profile Config: {voice_choice}\n")

    groq_key = os.getenv("OPENAI_API_KEY")
    if groq_key:
        print("✅ Groq Fallback Key detected in environment configuration profiles.")

    gemini_key = ApiKeyManager.get_api_key("GEMINI_API_KEY") or os.getenv("GEMINI_API_KEY")
    if not gemini_key:
        print("❌ CRITICAL ERROR: GEMINI_API_KEY is not configured in environment or Secrets.")
        sys.exit(1)

    print("DEBUG: Instantiating high-performance EdgeTTSVoiceModule.")
    voice_module = EdgeTTSVoiceModule(voiceName=voice_choice)

    print(f"--- Starting Generation for: {topic} ---")

    try:
        content_engine = FactsShortEngine(
            voiceModule=voice_module,
            facts_type=topic,
            background_video_name="ocean", 
            language=language
        )

        print("🔄 Executing ShortGPT core processing engine loop blocks...")
        
        # Intercept and sanitize schema maps on-the-fly right before Step 11 asset compilation
        engine_loop = content_engine.makeContent()
        
        while True:
            try:
                # Sanitize the underlying map before extracting the next generation log update
                if hasattr(content_engine, 'caption_timing_map') and content_engine.caption_timing_map:
                    content_engine.caption_timing_map = sanitize_numpy_types(content_engine.caption_timing_map)
                
                step_num, step_logs = next(engine_loop)
                print(f"   [Step {step_num}/12 Progress Update]: {step_logs}")
                
            except StopIteration:
                break

        print("\n=========================================================")
        print("🎉 SUCCESS: Short Video Project compiled and rendered!")
        print("=========================================================")

    except Exception as engine_failure:
        print("\n❌ CRITICAL CRASH: Automation pipeline processing halted.")
        print(f"Error Details: {str(engine_failure)}")
        print("\n--- Python Traceback Log Stack ---")
        traceback.print_exc()
        print("----------------------------------")
        sys.exit(1)

if __name__ == "__main__":
    main()
